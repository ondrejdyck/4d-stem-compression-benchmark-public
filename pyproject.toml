[project]
name = "4d-stem-compression-benchmark-public"
version = "0.0.0"
description = "Public-release artifacts and scripts for 4D-STEM compression benchmarking"
requires-python = ">=3.11"

dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "h5py>=3.8.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",
  "hdf5plugin>=4.0.0",
  "blosc2>=2.0.0",
  "zstandard>=0.21.0",
  "lz4>=4.3.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
]
notebooks = [
  "jupyter>=1.0.0",
  "ipykernel>=6.25.0",
  "notebook>=7.0.0",
]
# Only needed to regenerate the simulated dataset of the Discussion; the
# benchmark itself does not use them. PySlice is pinned to a tag rather than a
# branch so the multislice physics is fixed at the version this work used.
# PySlice requires Python 3.12; the benchmark itself runs on 3.11, so the
# marker keeps this extra from raising the floor for everyone else.
simulation = [
  "pyslice[fast] @ git+https://github.com/sea-ecosystem/PySlice.git@4dstem-compression-2026 ; python_version >= '3.12'",
  "ase>=3.22",
  # ovito arrives through PySlice. 3.16.1.post1 is a macOS-arm64-only
  # post-release, so resolving to "newest that satisfies" leaves this extra
  # uninstallable on Linux. 3.16.1 is the version the published dataset was
  # generated with and the one that ships a manylinux wheel.
  "ovito==3.16.1 ; python_version >= '3.12'",
]

[tool.uv]
package = false
